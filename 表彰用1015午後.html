<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本日の表彰 - 10/15 午後</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounce { 0%, 100% { transform: translateY(0);} 50% { transform: translateY(-20px);} }
    .animate-bounce { animation: bounce 2s infinite; }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-200 via-purple-200 to-blue-200 min-h-screen p-8">

<script>
// 表示用データ（10/15）
let AWARD_DATA = {
  date: '10/15',
  morning: {
    processing: { name: '田中商店', value: '152件' },
    orders: { name: '鈴木工業', value: '98件' },
    sales: { name: '佐藤物産', value: '¥2,450,000' }
  },
  afternoon: {
    processing: { name: '山田商事', value: '203件' },
    orders: { name: '田中商店', value: '145件' },
    sales: { name: '鈴木工業', value: '¥3,120,000' }
  },
  fullday: {
    processing: { name: '田中商店', value: '355件' },
    orders: { name: '鈴木工業', value: '243件' },
    sales: { name: '佐藤物産', value: '¥5,570,000' }
  }
};
</script>

<div class="max-w-4xl mx-auto">
  <!-- ヘッダー -->
  <div class="text-center mb-8">
    <h1 class="text-4xl font-bold text-gray-800 mb-2" id="mainTitle"></h1>
    <p class="text-gray-600">本日の成績上位者を表彰します</p>
  </div>

  <!-- 出力・共有 -->
  <div id="output-share-block" class="bg-white/80 backdrop-blur-sm rounded-2xl p-6 mb-6 shadow-lg">
    <div class="flex items-center gap-2 mb-4">
      <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M4 12h16"></path>
        <path d="M4 6h16"></path>
        <path d="M4 18h10"></path>
      </svg>
      <h2 class="text-xl font-bold text-gray-800">出力・共有</h2>
    </div>
    <div class="flex flex-wrap gap-2">
      <button id="btn-export-csv" class="px-4 py-2 rounded-lg bg-green-600 text-white font-semibold shadow hover:bg-green-700">CSV出力</button>
      <button id="btn-export-json" class="px-4 py-2 rounded-lg bg-teal-600 text-white font-semibold shadow hover:bg-teal-700">JSON出力</button>
      <button id="btn-print" class="px-4 py-2 rounded-lg bg-gray-700 text-white font-semibold shadow hover:bg-gray-800">印刷</button>
      <button id="btn-share" class="px-4 py-2 rounded-lg bg-purple-600 text-white font-semibold shadow hover:bg-purple-700">共有</button>
      <button id="btn-copy" class="px-4 py-2 rounded-lg bg-cyan-600 text-white font-semibold shadow hover:bg-cyan-700">コピー</button>
    </div>
  </div>

  <!-- 部の選択 -->
  <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-6 mb-6 shadow-lg">
    <div class="flex items-center gap-2 mb-4">
      <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <h2 class="text-xl font-bold text-gray-800">部を選択</h2>
    </div>
    <div class="grid grid-cols-3 gap-4">
      <button onclick="showPeriod('morning')" id="btn-morning" class="py-4 px-6 rounded-xl font-semibold transition-all duration-300 bg-white text-gray-700 hover:bg-gray-100 shadow">
        <div class="text-lg">🌅</div><div>午前の部</div><div class="text-sm opacity-80">12:00まで</div>
      </button>
      <button onclick="showPeriod('afternoon')" id="btn-afternoon" class="py-4 px-6 rounded-xl font-semibold transition-all duration-300 bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg scale-105">
        <div class="text-lg">🌇</div><div>午後の部</div><div class="text-sm opacity-80">18:00まで</div>
      </button>
      <button onclick="showPeriod('fullday')" id="btn-fullday" class="py-4 px-6 rounded-xl font-semibold transition-all duration-300 bg-white text-gray-700 hover:bg-gray-100 shadow">
        <div class="text-lg">📅</div><div>本日の総合</div><div class="text-sm opacity-80">全体</div>
      </button>
    </div>
  </div>

  <!-- 表彰表示領域（キャプチャ対象に含まれる） -->
  <div id="copy-target" class="bg-gradient-to-r from-pink-400 to-purple-400 rounded-3xl p-8 shadow-xl text-white mb-6">
    <h2 class="text-3xl font-bold text-center" id="periodTitle"></h2>
    <div class="flex justify-center mt-2">
      <span class="inline-block bg-white/30 backdrop-blur-sm rounded-full px-4 py-2 text-white font-semibold" id="periodTime"></span>
    </div>
    <div id="hero-congrats" class="mt-6 bg-gradient-to-b from-rose-400 to-pink-300 rounded-2xl p-8 shadow-inner">
      <div class="flex justify-center mb-4"><div class="text-yellow-300 animate-bounce text-8xl">🏆</div></div>
      <p class="text-white text-2xl font-bold text-center">おめでとうございます!</p>
    </div>
    <div class="space-y-4 mt-6">
      <div id="card-processing" class="bg-yellow-100 border-4 border-yellow-400 rounded-2xl p-6 shadow-lg flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="bg-yellow-400 rounded-full p-3">📈</div>
          <div>
            <h3 class="text-2xl font-bold text-yellow-800">処理数 1位</h3>
            <p class="text-3xl font-bold text-gray-800 mt-1" id="processing-name"></p>
            <p class="text-xl text-gray-600 mt-1" id="processing-value"></p>
          </div>
        </div>
        <div class="text-yellow-500 text-6xl">🏆</div>
      </div>
      <div id="card-orders" class="bg-red-100 border-4 border-red-400 rounded-2xl p-6 shadow-lg flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="bg-red-400 rounded-full p-3">🥇</div>
          <div>
            <h3 class="text-2xl font-bold text-red-800">受注数 1位</h3>
            <p class="text-3xl font-bold text-gray-800 mt-1" id="orders-name"></p>
            <p class="text-xl text-gray-600 mt-1" id="orders-value"></p>
          </div>
        </div>
        <div class="text-red-500 text-6xl">🏆</div>
      </div>
      <div id="card-sales" class="bg-pink-100 border-4 border-pink-400 rounded-2xl p-6 shadow-lg flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="bg-pink-400 rounded-full p-3">💰</div>
          <div>
            <h3 class="text-2xl font-bold text-pink-800">売上 1位</h3>
            <p class="text-3xl font-bold text-gray-800 mt-1" id="sales-name"></p>
            <p class="text-xl text-gray-600 mt-1" id="sales-value"></p>
          </div>
        </div>
        <div class="text-pink-500 text-6xl">🏆</div>
      </div>
    </div>
    <div class="mt-8 text-center">
      <div class="inline-block bg-white/90 backdrop-blur-sm rounded-full px-8 py-3 shadow-lg">
        <p class="text-gray-700 font-semibold">✨ おめでとうございます。お菓子が贈呈されます。 ✨</p>
      </div>
    </div>
  </div>
</div>

<!-- html2canvas（スクリーンショット用） -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<!-- html-to-image（見た目に忠実なレンダリング用） -->
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>

<script>
let currentPeriod = 'afternoon';
const periodInfo = {
  morning: { title: '午前の部', time: '🎉 12:00までの表彰 🎉' },
  afternoon: { title: '午後の部', time: '🎉 18:00までの表彰 🎉' },
  fullday: { title: '本日の総合', time: '🎉 全体の表彰 🎉' }
};

function showPeriod(period) {
  currentPeriod = period;
  ['morning', 'afternoon', 'fullday'].forEach(p => {
    const btn = document.getElementById(`btn-${p}`);
    if (!btn) return;
    btn.className = 'py-4 px-6 rounded-xl font-semibold transition-all duration-300 ' + (p === period ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg scale-105' : 'bg-white text-gray-700 hover:bg-gray-100 shadow');
  });
  const data = AWARD_DATA[period];
  document.getElementById('periodTitle').textContent = periodInfo[period].title;
  document.getElementById('periodTime').textContent = periodInfo[period].time;
  document.getElementById('processing-name').textContent = data.processing.name;
  document.getElementById('processing-value').textContent = data.processing.value;
  document.getElementById('orders-name').textContent = data.orders.name;
  document.getElementById('orders-value').textContent = data.orders.value;
  document.getElementById('sales-name').textContent = data.sales.name;
  document.getElementById('sales-value').textContent = data.sales.value;
}

function loadFromLocalStorage() {
  try {
    const stored = localStorage.getItem('AWARD_DATA');
    if (stored) {
      const parsed = JSON.parse(stored);
      if (parsed && parsed.date && parsed.morning && parsed.afternoon && parsed.fullday) {
        AWARD_DATA = parsed;
      }
    }
  } catch (e) { console.warn('ローカルデータの読み込みに失敗しました', e); }
}

document.getElementById('mainTitle').textContent = AWARD_DATA.date + ' 結果発表';
loadFromLocalStorage();
document.getElementById('mainTitle').textContent = AWARD_DATA.date + ' 結果発表';
showPeriod('afternoon');

// ===== 出力機能 =====
function download(filename, content, mime = 'text/plain') {
  const a = document.createElement('a');
  a.href = `data:${mime};charset=utf-8,` + encodeURIComponent(content);
  a.download = filename; a.click();
}
function exportCSV() {
  const periodLabel = { morning: '午前の部', afternoon: '午後の部', fullday: '本日の総合' };
  const categories = [ ['processing', '処理数'], ['orders', '受注数'], ['sales', '売上'] ];
  const periods = ['morning', 'afternoon', 'fullday'];
  let csv = '日付,部,項目,店舗名,値\n';
  periods.forEach(p => {
    categories.forEach(([key, label]) => {
      const item = AWARD_DATA[p][key];
      csv += `${AWARD_DATA.date},${periodLabel[p]},${label},${item.name},${item.value}\n`;
    });
  });
  download(`表彰_${AWARD_DATA.date}.csv`, csv, 'text/csv');
}
function exportJSON() { const json = JSON.stringify(AWARD_DATA, null, 2); download(`表彰_${AWARD_DATA.date}.json`, json, 'application/json'); }
function sharePage() {
  const shareData = { title: `${AWARD_DATA.date} 結果発表`, text: `${AWARD_DATA.date} の表彰結果をご覧ください`, url: location.href };
  if (navigator.share) { navigator.share(shareData).catch(() => {}); }
  else { navigator.clipboard?.writeText(location.href).then(() => alert('ページURLをコピーしました。')).catch(() => alert('共有機能が利用できません。')); }
}

// ===== 要素単体スクショ（クリップボード） =====
async function captureElementToClipboard(el, filename){
  // まずは html-to-image でより忠実な描画を試みる
  try {
    const dataUrl = await window.htmlToImage.toPng(el, {
      cacheBust: true,
      pixelRatio: window.devicePixelRatio || 1,
      backgroundColor: null,
      skipFonts: false
    });
    const blob = await (await fetch(dataUrl)).blob();
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
    alert(`${filename} をクリップボードにコピーしました。`);
    return;
  } catch (e) {
    console.warn('html-to-image でのコピーに失敗。html2canvasでフォールバックします。', e);
  }

  // フォールバック: html2canvas（foreignObjectRendering を有効化して精度向上）
  try {
    const canvas = await html2canvas(el, { scale: window.devicePixelRatio, useCORS: true, logging:false, foreignObjectRendering: true });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
    alert(`${filename} をクリップボードにコピーしました。`);
  } catch(err) {
    console.error(err);
    const canvas = await html2canvas(el, { scale: window.devicePixelRatio, useCORS: true, logging:false });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${filename}.png`; a.click(); URL.revokeObjectURL(url);
    alert('クリップボードへのコピーに失敗したため、画像をダウンロードしました。');
  }
}

function captureAll(){
  const el = document.getElementById('copy-target');
  if (!el) return alert('対象の範囲が見つかりません');
  return captureElementToClipboard(el, '午後の部_表彰一式');
}

// イベント登録
document.getElementById('btn-export-csv').addEventListener('click', exportCSV);
document.getElementById('btn-export-json').addEventListener('click', exportJSON);
document.getElementById('btn-print').addEventListener('click', () => window.print());
document.getElementById('btn-share').addEventListener('click', sharePage);
document.getElementById('btn-copy').addEventListener('click', captureAll);
</script>

</body>
</html>
