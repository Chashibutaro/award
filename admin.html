<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表彰データ 管理画面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .outline-node {
            transition: all 0.2s;
        }

        .outline-node:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        .editable:hover {
            background-color: rgba(255, 255, 0, 0.1);
            cursor: text;
            border-radius: 4px;
        }

        .editable:focus {
            background-color: white;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
            padding: 2px 4px;
        }

        details>summary {
            list-style: none;
        }

        details>summary::-webkit-details-marker {
            display: none;
        }

        .arrow {
            display: inline-block;
            transition: transform 0.2s;
        }

        details[open]>summary .arrow {
            transform: rotate(90deg);
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">表彰データ 管理画面</h1>
                <p class="text-sm text-gray-500">アウトライン形式でデータを編集できます</p>
            </div>
            <div class="flex gap-2">
                <a href="./表彰用.html" target="_blank"
                    class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 shadow-sm">
                    プレビュー
                </a>
                <button onclick="saveToLocalStorage()"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm font-medium">
                    一時保存 (Local)
                </button>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左側: アウトラインエディタ -->
            <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                    <h2 class="font-semibold text-gray-700">データ編集</h2>
                    <div class="text-sm text-gray-500">
                        日付: <span id="date-display" class="editable font-mono font-bold text-gray-900 px-2"
                            contenteditable="true">--/--</span>
                    </div>
                </div>
                <div id="outline-container" class="p-6 space-y-4">
                    <!-- JSで生成 -->
                </div>
            </div>

            <!-- 右側: 公開設定 -->
            <div class="space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                            </path>
                        </svg>
                        公開 (GitHub)
                    </h3>
                    <p class="text-xs text-gray-600 mb-4">
                        変更をサーバー(GitHub)に保存し、全員が見られるようにします。
                    </p>

                    <div class="space-y-3 mb-4">
                        <input id="gh-owner" type="text" placeholder="Owner (User)"
                            class="w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-teal-500 focus:ring-teal-500">
                        <input id="gh-repo" type="text" placeholder="Repository"
                            class="w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-teal-500 focus:ring-teal-500">
                        <input id="gh-token" type="password" placeholder="Personal Access Token"
                            class="w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-teal-500 focus:ring-teal-500">
                    </div>

                    <button onclick="saveToGitHub()"
                        class="w-full py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 shadow-md font-bold transition transform active:scale-95">
                        公開する
                    </button>
                    <p id="status-msg" class="text-xs text-center mt-2 text-gray-500 h-4"></p>
                </div>

                <div class="bg-blue-50 rounded-xl p-5 border border-blue-100">
                    <h4 class="text-sm font-bold text-blue-800 mb-2">ヒント</h4>
                    <ul class="text-xs text-blue-700 space-y-1 list-disc list-inside">
                        <li>テキストをクリックして直接編集できます</li>
                        <li>「公開する」を押すと数分で反映されます</li>
                        <li>自分専用の編集画面です</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script>
        // データ構造の定義（表示順序とラベル）
        const SECTIONS = [
            { id: 'current', label: '今の現状' },
            { id: 'today_summary', label: '今日の現状' },
            { id: 'morning', label: '午前' },
            { id: 'afternoon', label: '午後' },
            { id: 'fullday', label: '1日全体' }
        ];

        const FIELDS = [
            { id: 'processing', label: '処理数 1位' },
            { id: 'orders', label: '受注数 1位' },
            { id: 'sales', label: '売上 1位' }
        ];

        let currentData = {
            date: "10/15",
            current: {}, today_summary: {}, morning: {}, afternoon: {}, fullday: {}
        };

        // 初期化
        async function init() {
            // LocalStorage優先、なければデフォルト
            const local = localStorage.getItem('AWARD_DATA_V2');
            if (local) {
                try {
                    currentData = JSON.parse(local);
                } catch (e) { console.error(e); }
            } else {
                // award.jsonがあればそこから読み込む（初回用）
                try {
                    const res = await fetch('award.json');
                    if (res.ok) {
                        const json = await res.json();
                        // マージ
                        currentData = { ...currentData, ...json };
                    }
                } catch (e) { }
            }

            renderOutline();
            restoreGitHubSettings();
        }

        // アウトラインの描画
        function renderOutline() {
            const container = document.getElementById('outline-container');
            container.innerHTML = '';

            // 日付
            document.getElementById('date-display').textContent = currentData.date || '--/--';
            document.getElementById('date-display').onblur = (e) => {
                currentData.date = e.target.textContent.trim();
                autoSave();
            };

            SECTIONS.forEach(section => {
                const sectionData = currentData[section.id] || {};

                const details = document.createElement('details');
                details.open = true; // デフォルト展開
                details.className = 'group bg-white rounded-lg border border-gray-100 shadow-sm mb-2';

                const summary = document.createElement('summary');
                summary.className = 'cursor-pointer p-3 bg-gray-50 hover:bg-gray-100 rounded-t-lg font-bold text-gray-700 flex items-center select-none';
                summary.innerHTML = `
                    <span class="arrow mr-2 text-gray-400">▶</span>
                    ${section.label}
                `;
                details.appendChild(summary);

                const content = document.createElement('div');
                content.className = 'p-4 space-y-3 border-t border-gray-100';

                FIELDS.forEach(field => {
                    const fieldData = sectionData[field.id] || { name: '', value: '' };

                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-4 text-sm';

                    row.innerHTML = `
                        <div class="w-24 font-medium text-gray-500 text-right flex-shrink-0">${field.label}</div>
                        <div class="flex-1 grid grid-cols-2 gap-2">
                            <div class="relative group/input">
                                <span class="absolute -top-2 left-2 text-[10px] text-gray-400 bg-white px-1 opacity-0 group-hover/input:opacity-100 transition">ISR名</span>
                                <div class="editable p-2 border border-transparent hover:border-gray-200" contenteditable="true" 
                                     data-section="${section.id}" data-field="${field.id}" data-key="name">
                                     ${fieldData.name || '-'}
                                </div>
                            </div>
                            <div class="relative group/input">
                                <span class="absolute -top-2 left-2 text-[10px] text-gray-400 bg-white px-1 opacity-0 group-hover/input:opacity-100 transition">値</span>
                                <div class="editable p-2 border border-transparent hover:border-gray-200 text-right font-mono" contenteditable="true"
                                     data-section="${section.id}" data-field="${field.id}" data-key="value">
                                     ${fieldData.value || '-'}
                                </div>
                            </div>
                        </div>
                    `;
                    content.appendChild(row);
                });

                details.appendChild(content);
                container.appendChild(details);
            });

            // イベントリスナー設定
            document.querySelectorAll('.editable').forEach(el => {
                el.addEventListener('blur', (e) => {
                    const section = e.target.dataset.section;
                    const field = e.target.dataset.field;
                    const key = e.target.dataset.key;

                    if (section && field && key) {
                        if (!currentData[section]) currentData[section] = {};
                        if (!currentData[section][field]) currentData[section][field] = {};
                        currentData[section][field][key] = e.target.textContent.trim();
                        autoSave();
                    }
                });
            });
        }

        function autoSave() {
            localStorage.setItem('AWARD_DATA_V2', JSON.stringify(currentData));
            document.getElementById('status-msg').textContent = 'ローカルに保存しました';
            setTimeout(() => document.getElementById('status-msg').textContent = '', 2000);
        }

        function saveToLocalStorage() {
            autoSave();
            alert('ローカルに保存しました。');
        }

        // GitHub設定の復元
        function restoreGitHubSettings() {
            const settings = JSON.parse(localStorage.getItem('GH_SETTINGS') || '{}');
            if (settings.owner) document.getElementById('gh-owner').value = settings.owner;
            if (settings.repo) document.getElementById('gh-repo').value = settings.repo;
            // Tokenはセキュリティ上保存しないか、SessionStorageにするのが一般的だが、
            // 利便性のためLocalStorageに入れる場合は注意が必要。ここでは入力値を維持する簡易実装。
        }

        async function saveToGitHub() {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            if (!owner || !repo || !token) {
                alert('GitHub設定（Owner, Repo, Token）を入力してください');
                return;
            }

            // 設定を保存
            localStorage.setItem('GH_SETTINGS', JSON.stringify({ owner, repo }));

            const btn = document.querySelector('button[onclick="saveToGitHub()"]');
            const originalText = btn.textContent;
            btn.textContent = '送信中...';
            btn.disabled = true;

            try {
                // 1. Get SHA
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/award.json`;
                const headers = {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                };

                let sha = null;
                try {
                    const getRes = await fetch(url, { headers });
                    if (getRes.ok) {
                        const data = await getRes.json();
                        sha = data.sha;
                    }
                } catch (e) { console.log('File not found, creating new.'); }

                // 2. Put Content
                // JSONを整形して保存
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2))));

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Update award data ${currentData.date}`,
                        content: content,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert('公開しました！反映まで少し時間がかかります。');
                } else {
                    const err = await putRes.json();
                    alert('エラーが発生しました: ' + (err.message || 'Unknown error'));
                }

            } catch (e) {
                alert('通信エラー: ' + e.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        init();
    </script>
</body>

</html>
