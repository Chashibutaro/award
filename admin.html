<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Award Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="text-slate-600">

    <div class="min-h-screen p-6">
        <header class="max-w-7xl mx-auto mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Award Admin</h1>
                <p class="text-sm text-slate-500">表彰データ管理パネル</p>
            </div>
            <div class="flex gap-3">
                <span id="status-msg" class="text-sm font-bold h-6 flex items-center"></span>
                <button onclick="publishToGitHub()"
                    class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-bold shadow-lg shadow-slate-200 transition flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd"
                            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                            clip-rule="evenodd" />
                    </svg>
                    GitHubに公開
                </button>
                <a href="表彰用.html" target="_blank"
                    class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-4 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                    Open Viewer
                </a>
            </div>
        </header>

        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Settings -->
            <div class="space-y-6">
                <!-- Global Settings -->
                <div class="glass-panel rounded-2xl p-6 space-y-4">
                    <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        基本設定
                    </h2>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Display Date</label>
                        <input type="text" id="date-input"
                            class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 font-bold text-slate-700 focus:ring-2 focus:ring-purple-400 focus:border-transparent outline-none transition"
                            placeholder="e.g. 11/24">
                    </div>
                    <div class="pt-4 border-t border-slate-200">
                        <button onclick="autoSave()"
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-lg shadow-md shadow-purple-200 transition mb-2">
                            Save (Local)
                        </button>
                        <button onclick="archiveData()"
                            class="w-full bg-white hover:bg-slate-50 text-slate-600 font-bold py-2 rounded-lg border border-slate-200 transition">
                            Archive Data
                        </button>
                    </div>
                </div>

                <!-- Visual Settings -->
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01">
                            </path>
                        </svg>
                        Visual Settings
                    </h2>
                    <div class="space-y-3">
                        <label class="flex items-center justify-between cursor-pointer group">
                            <span class="text-slate-600 font-medium group-hover:text-purple-600 transition">Count-up
                                Animation</span>
                            <div class="relative">
                                <input type="checkbox" id="visual-countUp" class="sr-only peer">
                                <div
                                    class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600">
                                </div>
                            </div>
                        </label>
                        <label class="flex items-center justify-between cursor-pointer group">
                            <span class="text-slate-600 font-medium group-hover:text-purple-600 transition">Confetti
                                Effects</span>
                            <div class="relative">
                                <input type="checkbox" id="visual-confetti" class="sr-only peer">
                                <div
                                    class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600">
                                </div>
                            </div>
                        </label>
                        <label class="flex items-center justify-between cursor-pointer group">
                            <span class="text-slate-600 font-medium group-hover:text-purple-600 transition">Comment
                                Display</span>
                            <div class="relative">
                                <input type="checkbox" id="visual-comments" class="sr-only peer">
                                <div
                                    class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600">
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- GitHub Settings -->
                <div class="glass-panel rounded-2xl p-6">
                    <details class="group">
                        <summary class="flex justify-between items-center font-bold text-slate-700 cursor-pointer">
                            <div class="flex items-center gap-2">
                                <svg class="w-5 h-5 text-slate-500" fill="currentColor" viewBox="0 0 24 24">
                                    <path
                                        d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                                </svg>
                                GitHub連携
                            </div>
                            <svg class="w-4 h-4 text-slate-400 arrow" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7">
                                </path>
                            </svg>
                        </summary>
                        <div class="mt-4 space-y-3">
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Repo Owner</label>
                                <input type="text" id="gh-owner"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-3 py-1.5 text-sm"
                                    placeholder="username">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Repo Name</label>
                                <input type="text" id="gh-repo"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-3 py-1.5 text-sm"
                                    placeholder="repository">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Branch</label>
                                <input type="text" id="gh-branch"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-3 py-1.5 text-sm"
                                    placeholder="main">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase">Token</label>
                                <input type="password" id="gh-token"
                                    class="w-full bg-slate-50 border border-slate-200 rounded px-3 py-1.5 text-sm"
                                    placeholder="ghp_...">
                            </div>
                            <button onclick="saveGitHubSettings()"
                                class="w-full bg-slate-800 text-white text-sm font-bold py-2 rounded hover:bg-slate-700 transition">
                                設定を保存
                            </button>
                        </div>
                    </details>
                </div>

                <!-- History List -->
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        過去の履歴
                    </h2>
                    <div id="history-container" class="space-y-2 max-h-[300px] overflow-y-auto pr-2">
                        <!-- History items will be rendered here -->
                    </div>
                </div>
            </div>

            <!-- Right Column: Data Entry -->
            <div class="lg:col-span-2 space-y-6">
                <div id="data-container" class="space-y-6">
                    <!-- Sections will be generated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const SECTIONS = [
            { id: 'morning', title: '午前の部', color: 'orange' },
            { id: 'afternoon', title: '午後の部', color: 'indigo' }
        ];
        const FIELDS = ['processing', 'orders', 'sales'];
        const FIELD_LABELS = { processing: '処理数', orders: '受注数', sales: '売上' };

        let currentData = {
            date: '--/--',
            config: {
                theme: 'default',
                visuals: {
                    countUp: false,
                    confetti: false,
                    comments: false
                }
            },
            history: []
        };

        // Initialize
        function init() {
            // Load data
            const saved = localStorage.getItem('AWARD_DATA_V2');
            if (saved) {
                try {
                    currentData = JSON.parse(saved);
                    // Ensure visuals config exists
                    if (!currentData.config) currentData.config = {};
                    if (!currentData.config.visuals) {
                        currentData.config.visuals = {
                            countUp: false,
                            confetti: false,
                            comments: false
                        };
                    }
                } catch (e) {
                    console.error('Data load error', e);
                }
            }

            // Render
            document.getElementById('date-input').value = currentData.date || '';
            renderConfig();
            renderOutline();
            renderHistory();
            restoreGitHubSettings();

            // Event Listeners
            document.getElementById('date-input').addEventListener('input', (e) => {
                currentData.date = e.target.value;
                autoSave();
            });
        }

        function renderConfig() {
            const visuals = currentData.config.visuals || {};
            document.getElementById('visual-countUp').checked = visuals.countUp || false;
            document.getElementById('visual-confetti').checked = visuals.confetti || false;
            document.getElementById('visual-comments').checked = visuals.comments || false;

            // Add listeners
            ['countUp', 'confetti', 'comments'].forEach(key => {
                document.getElementById(`visual-${key}`).addEventListener('change', (e) => {
                    if (!currentData.config.visuals) currentData.config.visuals = {};
                    currentData.config.visuals[key] = e.target.checked;
                    autoSave();
                });
            });
        }

        function renderOutline() {
            const container = document.getElementById('data-container');
            container.innerHTML = '';

            SECTIONS.forEach(section => {
                const details = document.createElement('details');
                details.className = 'glass-panel rounded-2xl group overflow-hidden transition-all duration-300';
                details.open = true;

                const summary = document.createElement('summary');
                summary.className = 'p-6 cursor-pointer bg-white/50 hover:bg-white/80 transition flex justify-between items-center';
                summary.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-3 h-8 rounded-full bg-${section.color}-500"></div>
                        <h3 class="text-xl font-bold text-slate-700">${section.title}</h3>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="clearSection('${section.id}', event)" class="text-xs text-red-400 hover:text-red-600 font-bold px-3 py-1 rounded border border-red-100 hover:bg-red-50 transition">
                            クリア
                        </button>
                        <svg class="w-5 h-5 text-slate-400 arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                `;

                const content = document.createElement('div');
                content.className = 'p-6 pt-0 space-y-6 bg-white/30';

                FIELDS.forEach(fieldId => {
                    const fieldData = (currentData[section.id] && currentData[section.id][fieldId]) || {};
                    const label = FIELD_LABELS[fieldId] || fieldId;

                    const row = document.createElement('div');
                    row.className = 'bg-white/40 rounded-xl p-4 border border-white/50';
                    row.innerHTML = `
                        <div class="mb-3 font-bold text-slate-600 border-l-4 border-${section.color}-500 pl-2 flex items-center gap-2">
                            ${label}
                            <span class="text-[10px] font-normal text-slate-400 uppercase tracking-wider">${fieldId}</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                            <div class="relative group/input">
                                <span class="absolute -top-2 left-2 text-[10px] font-bold text-slate-300 bg-white px-1">NAME</span>
                                <div class="editable p-2.5 text-slate-700 font-medium bg-white/50 rounded border border-slate-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition outline-none" contenteditable="true" 
                                     data-section="${section.id}" data-field="${fieldId}" data-key="name">
                                    ${fieldData.name || ''}
                                </div>
                            </div>
                            <div class="relative group/input">
                                <span class="absolute -top-2 left-2 text-[10px] font-bold text-slate-300 bg-white px-1">VALUE</span>
                                <div class="editable p-2.5 text-right font-mono font-bold text-slate-700 bg-white/50 rounded border border-slate-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition outline-none" contenteditable="true" 
                                     data-section="${section.id}" data-field="${fieldId}" data-key="value">
                                    ${fieldData.value || ''}
                                </div>
                            </div>
                        </div>
                        <div class="relative group/input">
                            <span class="absolute -top-2 left-2 text-[10px] font-bold text-slate-300 bg-white px-1">COMMENT</span>
                            <div class="editable p-2.5 text-sm text-slate-600 min-h-[40px] bg-white/50 rounded border border-slate-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition outline-none" contenteditable="true" 
                                 data-section="${section.id}" data-field="${fieldId}" data-key="comment">
                                ${fieldData.comment || ''}
                            </div>
                        </div>
                    `;
                    content.appendChild(row);
                });

                details.appendChild(summary);
                details.appendChild(content);
                container.appendChild(details);
            });

            document.querySelectorAll('.editable').forEach(el => {
                el.addEventListener('blur', (e) => {
                    const section = e.target.dataset.section;
                    const field = e.target.dataset.field;
                    const key = e.target.dataset.key;

                    if (section && field && key) {
                        if (!currentData[section]) currentData[section] = {};
                        if (!currentData[section][field]) currentData[section][field] = {};
                        currentData[section][field][key] = e.target.textContent.trim();
                        autoSave();
                    }
                });
            });
        }

        function clearSection(sectionId, event) {
            event.stopPropagation();
            if (!confirm('このセクションをクリアしますか？')) return;

            if (currentData[sectionId]) {
                FIELDS.forEach(field => {
                    if (currentData[sectionId][field]) {
                        currentData[sectionId][field] = { name: '', value: '', comment: '' };
                    }
                });
                renderOutline();
                autoSave();
            }
        }

        function autoSave() {
            currentData.lastUpdated = new Date().toISOString();
            localStorage.setItem('AWARD_DATA_V2', JSON.stringify(currentData));
            const msg = document.getElementById('status-msg');
            msg.textContent = '保存しました';
            msg.classList.add('text-teal-600');
            setTimeout(() => {
                msg.textContent = '';
                msg.classList.remove('text-teal-600');
            }, 2000);
        }

        function archiveData() {
            if (!currentData.date || currentData.date === '--/--') {
                alert('日付が設定されていません。');
                return;
            }
            if (!confirm(`${currentData.date} のデータをアーカイブ（履歴保存）しますか？`)) return;

            if (!currentData.history) currentData.history = [];

            const existingIndex = currentData.history.findIndex(h => h.date === currentData.date);

            const record = JSON.parse(JSON.stringify({
                date: currentData.date,
                config: currentData.config,
                morning: currentData.morning,
                afternoon: currentData.afternoon,
                fullday: currentData.fullday
            }));

            if (existingIndex >= 0) {
                currentData.history[existingIndex] = record;
                alert('既存の履歴を上書きしました。');
            } else {
                currentData.history.unshift(record);
                alert('履歴に追加しました。');
            }
            autoSave();
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            if (!container) return;

            if (!currentData.history || currentData.history.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">履歴データがありません</p>';
                return;
            }

            container.innerHTML = '';
            currentData.history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 bg-white rounded-lg border border-slate-200 hover:border-purple-300 transition group';
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        <span class="font-mono font-bold text-slate-700">${item.date}</span>
                    </div>
                    <button onclick="deleteHistoryItem(${index})"
                        class="opacity-0 group-hover:opacity-100 text-xs bg-red-50 border border-red-200 text-red-600 hover:bg-red-100 px-2 py-1 rounded transition flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 2 0 00-1 1v3M4 7h16">
                            </path>
                        </svg>
                        削除
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function deleteHistoryItem(index) {
            if (!currentData.history || index < 0 || index >= currentData.history.length) return;

            const item = currentData.history[index];
            if (!confirm(`${item.date} の履歴データを削除しますか？\nこの操作は取り消せません。`)) return;

            currentData.history.splice(index, 1);
            autoSave();
            renderHistory();
        }

        // GitHub Integration
        function saveGitHubSettings() {
            const owner = document.getElementById('gh-owner').value;
            const repo = document.getElementById('gh-repo').value;
            const branch = document.getElementById('gh-branch').value;
            const token = document.getElementById('gh-token').value;

            localStorage.setItem('AWARD_GH_OWNER', owner);
            localStorage.setItem('AWARD_GH_REPO', repo);
            localStorage.setItem('AWARD_GH_BRANCH', branch);
            localStorage.setItem('AWARD_GH_TOKEN', token);

            alert('GitHub設定を保存しました');
        }

        function restoreGitHubSettings() {
            document.getElementById('gh-owner').value = localStorage.getItem('AWARD_GH_OWNER') || '';
            document.getElementById('gh-repo').value = localStorage.getItem('AWARD_GH_REPO') || '';
            document.getElementById('gh-branch').value = localStorage.getItem('AWARD_GH_BRANCH') || 'main';
            document.getElementById('gh-token').value = localStorage.getItem('AWARD_GH_TOKEN') || '';
        }

        async function publishToGitHub() {
            const owner = localStorage.getItem('AWARD_GH_OWNER');
            const repo = localStorage.getItem('AWARD_GH_REPO');
            const branch = localStorage.getItem('AWARD_GH_BRANCH') || 'main';
            const token = localStorage.getItem('AWARD_GH_TOKEN');

            if (!owner || !repo || !token) {
                alert('GitHub設定が不十分です。「GitHub連携」セクションで設定を行ってください。');
                return;
            }

            if (!confirm('現在のデータをGitHubに公開（プッシュ）しますか？\naward.json が上書きされます。')) return;

            const path = 'award.json';
            const content = JSON.stringify(currentData, null, 2);
            const message = `Update award data: ${currentData.date}`;
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            const msg = document.getElementById('status-msg');
            msg.textContent = 'GitHubに送信中...';
            msg.className = 'text-sm font-bold text-blue-600 h-6';

            try {
                // 1. Get current SHA
                let sha = null;
                const getRes = await fetch(`${apiUrl}?ref=${branch}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getRes.ok) {
                    const data = await getRes.json();
                    sha = data.sha;
                } else if (getRes.status !== 404) {
                    throw new Error('Failed to fetch file info');
                }

                // 2. Update file
                // UTF-8 to Base64
                const contentEncoded = window.btoa(unescape(encodeURIComponent(content)));

                const body = {
                    message: message,
                    content: contentEncoded,
                    branch: branch
                };
                if (sha) body.sha = sha;

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (putRes.ok) {
                    msg.textContent = 'GitHub公開完了!';
                    msg.className = 'text-sm font-bold text-green-600 h-6';
                    alert('GitHubへの公開が完了しました！');
                } else {
                    const err = await putRes.json();
                    throw new Error(err.message || 'Update failed');
                }

            } catch (e) {
                console.error(e);
                msg.textContent = 'エラーが発生しました';
                msg.className = 'text-sm font-bold text-red-600 h-6';
                alert(`エラーが発生しました: ${e.message}`);
            } finally {
                setTimeout(() => {
                    msg.textContent = '';
                }, 5000);
            }
        }

        // Start
        init();
    </script>
</body>
