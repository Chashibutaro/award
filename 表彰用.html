<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表彰ボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

    body {
      font-family: 'Noto Sans JP', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .card-gradient {
      background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
    }

    .gold-text {
      background: linear-gradient(45deg, #B8860B, #FFD700, #B8860B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .section-title {
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 2px;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen p-4 md:p-8 text-slate-800">

  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex justify-between items-end mb-8 pb-4 border-b border-slate-300">
      <div>
        <h1 class="text-4xl md:text-5xl font-black tracking-tight text-slate-900 mb-2">
          DAILY AWARD
        </h1>
        <p class="text-slate-600 text-lg font-medium">
          <span id="display-date" class="text-2xl font-bold text-blue-600 mr-2">--/--</span>
          の表彰
        </p>
      </div>
      <div class="text-right hidden md:block">
        <div class="text-sm text-slate-500">Last Updated</div>
        <div id="last-updated" class="font-mono text-slate-700">--:--</div>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">

      <!-- 1. 今の現状 -->
      <div class="xl:col-span-1 space-y-6">
        <div class="glass rounded-2xl p-6 shadow-lg border-t-4 border-blue-500 h-full">
          <h2 class="text-xl font-bold text-slate-800 mb-6 section-title">今の現状</h2>
          <div id="container-current" class="space-y-6">
            <!-- Content -->
          </div>
        </div>
      </div>

      <!-- 2. 今日の現状 -->
      <div class="xl:col-span-1 space-y-6">
        <div class="glass rounded-2xl p-6 shadow-lg border-t-4 border-teal-500 h-full">
          <h2 class="text-xl font-bold text-slate-800 mb-6 section-title">今日の現状</h2>
          <div id="container-today_summary" class="space-y-6">
            <!-- Content -->
          </div>
        </div>
      </div>

      <!-- 3. 午前・午後・全体 (メインエリア) -->
      <div class="xl:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- 午前 -->
        <div class="glass rounded-2xl p-5 shadow-md">
          <h3 class="text-lg font-bold text-slate-600 mb-4 flex items-center gap-2">
            <span class="w-2 h-8 bg-orange-400 rounded-full"></span>
            午前
          </h3>
          <div id="container-morning" class="space-y-4"></div>
        </div>

        <!-- 午後 -->
        <div class="glass rounded-2xl p-5 shadow-md">
          <h3 class="text-lg font-bold text-slate-600 mb-4 flex items-center gap-2">
            <span class="w-2 h-8 bg-indigo-400 rounded-full"></span>
            午後
          </h3>
          <div id="container-afternoon" class="space-y-4"></div>
        </div>

        <!-- 1日全体 -->
        <div
          class="glass rounded-2xl p-5 shadow-xl transform md:-translate-y-2 border-2 border-yellow-400/30 bg-yellow-50/50">
          <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
            <span class="w-2 h-8 bg-yellow-500 rounded-full"></span>
            <span class="gold-text text-xl">1日全体</span>
          </h3>
          <div id="container-fullday" class="space-y-4"></div>
        </div>

      </div>
    </div>
  </div>

  <template id="card-template">
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 label-field">CATEGORY</div>
      <div class="flex justify-between items-end">
        <div class="font-bold text-lg text-slate-800 name-field truncate pr-2">Name</div>
        <div class="font-mono font-bold text-xl text-blue-600 value-field">Value</div>
      </div>
    </div>
  </template>

  <script>
    const LABELS = {
      processing: '処理数 1位',
      orders: '受注数 1位',
      sales: '売上 1位'
    };

    async function loadData() {
      let data = null;

      // 1. Try fetching award.json
      try {
        const res = await fetch('award.json?t=' + new Date().getTime());
        if (res.ok) {
          data = await res.json();
        }
      } catch (e) { console.error(e); }

      // 2. Fallback to localStorage if json is missing (for local testing)
      if (!data) {
        const local = localStorage.getItem('AWARD_DATA_V2');
        if (local) data = JSON.parse(local);
      }

      if (data) render(data);
    }

    function render(data) {
      document.getElementById('display-date').textContent = data.date || '--/--';
      document.getElementById('last-updated').textContent = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      const sections = ['current', 'today_summary', 'morning', 'afternoon', 'fullday'];

      sections.forEach(sec => {
        const container = document.getElementById(`container-${sec}`);
        if (!container) return;
        container.innerHTML = '';

        const secData = data[sec] || {};

        // Define order
        const fields = ['processing', 'orders', 'sales'];

        fields.forEach(field => {
          const item = secData[field] || { name: '-', value: '-' };

          const template = document.getElementById('card-template').content.cloneNode(true);
          template.querySelector('.label-field').textContent = LABELS[field];
          template.querySelector('.name-field').textContent = item.name || '-';
          template.querySelector('.value-field').textContent = item.value || '-';

          // Highlight for Fullday
          if (sec === 'fullday') {
            template.querySelector('.value-field').classList.add('text-2xl', 'text-yellow-600');
            template.querySelector('.value-field').classList.remove('text-blue-600');
          }

          container.appendChild(template);
        });
      });
    }

    // Auto reload every 5 minutes
    setInterval(loadData, 300000);
    loadData();
  </script>
</body>

</html>
