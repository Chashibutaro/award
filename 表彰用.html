<script>
let currentPeriod = 'morning';

const periodInfo = {
    morning: { title: '午前の部', time: '🎉 12:00までの表彰 🎉' },
    afternoon: { title: '午後の部', time: '🎉 18:00までの表彰 🎉' },
    fullday: { title: '本日の総合', time: '🎉 全体の表彰 🎉' }
};

function showPeriod(period) {
    currentPeriod = period;
    
    // ボタンのスタイル更新
    ['morning', 'afternoon', 'fullday'].forEach(p => {
        const btn = document.getElementById(`btn-${p}`);
        if (p === period) {
            btn.className = 'py-4 px-6 rounded-xl font-semibold transition-all duration-300 bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg scale-105';
        } else {
            btn.className = 'py-4 px-6 rounded-xl font-semibold transition-all duration-300 bg-white text-gray-700 hover:bg-gray-100 shadow';
        }
    });
    
    // データ表示更新
    const data = AWARD_DATA[period];
    document.getElementById('periodTitle').textContent = periodInfo[period].title;
    document.getElementById('periodTime').textContent = periodInfo[period].time;
    
    document.getElementById('processing-name').textContent = data.processing.name;
    document.getElementById('processing-value').textContent = data.processing.value;
    
    document.getElementById('orders-name').textContent = data.orders.name;
    document.getElementById('orders-value').textContent = data.orders.value;
    
    document.getElementById('sales-name').textContent = data.sales.name;
    document.getElementById('sales-value').textContent = data.sales.value;
}

// 初期表示（ローカル保存から読み込み）
function loadFromLocalStorage() {
    try {
        const stored = localStorage.getItem('AWARD_DATA');
        if (stored) {
            const parsed = JSON.parse(stored);
            // 簡易チェック
            if (parsed && parsed.date && parsed.morning && parsed.afternoon && parsed.fullday) {
                AWARD_DATA = parsed;
            }
        }
    } catch (e) {
        console.warn('ローカルデータの読み込みに失敗しました', e);
    }
}

// 公開用共有データ（award.json）から読み込み（成功時はこれを優先）
async function loadFromAwardJSON() {
    try {
        const res = await fetch('award.json', { cache: 'no-store' });
        if (res.ok) {
            const data = await res.json();
            if (data && data.date && data.morning && data.afternoon && data.fullday) {
                AWARD_DATA = data;
                return true;
            }
        }
    } catch (e) {
        console.warn('award.jsonの読み込みに失敗しました', e);
    }
    return false;
}

// 初期化：まずaward.jsonを試し、失敗時のみローカル保存を利用
(async () => {
    const loaded = await loadFromAwardJSON();
    if (!loaded) {
        loadFromLocalStorage();
    }
    document.getElementById('mainTitle').textContent = AWARD_DATA.date + ' 結果発表';
    showPeriod('morning');
    // コピーボタン連携
    const btnCopy = document.getElementById('btn-copy');
    if (btnCopy) {
      btnCopy.addEventListener('click', async () => {
        const target = document.getElementById('copy-target');
        const label = `${AWARD_DATA.date}_${periodInfo[currentPeriod].title}`;
        await captureElementToClipboard(target, label);
      });
    }
})();

// ===== 出力機能 =====
function download(filename, content, mime = 'text/plain') {
    const a = document.createElement('a');
    a.href = `data:${mime};charset=utf-8,` + encodeURIComponent(content);
    a.download = filename;
    a.click();
}

function exportCSV() {
    const periodLabel = { morning: '午前の部', afternoon: '午後の部', fullday: '本日の総合' };
    const categories = [ ['processing', '処理数'], ['orders', '受注数'], ['sales', '売上'] ];
    const periods = ['morning', 'afternoon', 'fullday'];
    let csv = '日付,部,項目,店舗名,値\n';
    periods.forEach(p => {
        categories.forEach(([key, label]) => {
            const item = AWARD_DATA[p][key];
            csv += `${AWARD_DATA.date},${periodLabel[p]},${label},${item.name},${item.value}\n`;
        });
    });
    download(`表彰_${AWARD_DATA.date}.csv`, csv, 'text/csv');
}

function exportJSON() {
    const json = JSON.stringify(AWARD_DATA, null, 2);
    download(`表彰_${AWARD_DATA.date}.json`, json, 'application/json');
}

// ===== スクショ（見た目に忠実） =====
async function captureElementToClipboard(el, filename){
  // まずは html-to-image で忠実な描画を試す
  try {
    const dataUrl = await window.htmlToImage.toPng(el, {
      cacheBust: true,
      pixelRatio: window.devicePixelRatio || 1,
      backgroundColor: null,
      skipFonts: false
    });
    const blob = await (await fetch(dataUrl)).blob();
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
    alert(`${filename} をクリップボードにコピーしました。`);
    return;
  } catch (e) {
    console.warn('html-to-image に失敗。html2canvasへフォールバックします。', e);
  }

  // フォールバック: html2canvas（foreignObjectRendering 有効）
  try {
    const canvas = await html2canvas(el, { scale: window.devicePixelRatio, useCORS: true, logging:false, foreignObjectRendering: true });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
    alert(`${filename} をクリップボードにコピーしました。`);
  } catch(err) {
    console.error(err);
    const canvas = await html2canvas(el, { scale: window.devicePixelRatio, useCORS: true, logging:false });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${filename}.png`; a.click(); URL.revokeObjectURL(url);
    alert('クリップボードへのコピーに失敗したため、画像をダウンロードしました。');
  }
}

function sharePage() {
    const shareData = {
        title: `${AWARD_DATA.date} 結果発表`,
        text: `${AWARD_DATA.date} の表彰結果をご覧ください`,
        url: location.href
    };
    if (navigator.share) {
        navigator.share(shareData).catch(() => {});
    } else {
        // Web Share 非対応のためURLコピー
        navigator.clipboard?.writeText(location.href).then(() => {
            alert('ページURLをクリップボードにコピーしました。');
        }).catch(() => {
            alert('共有機能が利用できません。URLを手動で共有してください。');
        });
    }
}
